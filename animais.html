<html>
<head>
<title>Animais Peçonhentos</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-image: url("imagen.avif"); 
        background-size: cover;
        background-position: center;
        color: white;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
    }

    .container {
        display: flex;
        flex-direction: column;
        gap: 40px;
        padding: 20px;
    }

    .item {
        width: 300px;
        text-align: center;
        color: black;
    }

    .right {
        align-self: flex-end;
    }

    .center {
        align-self: center;
    }

    .left {
        align-self: flex-start;
    }

    img {
        width: 100%;
        border-radius: 10px;
        border: 2px solid white;
    }
    .vermelho {
  color: rgb(0, 0, 0);
}
</style>
</head>

<body>
    <h1>
        <strong class="vermelho">animais peçonhentos</strong>
      </h1>

<div class="container">

    <div class="item right">
        <p>Cobra</p>
        <img src="cobra.webp" alt="Cobra">
    </div>

    <div class="item center">
        <p>Escorpião</p>
        <img src="escorpião.webp" alt="Escorpião">
    </div>

    <div class="item left">
        <p>Aranha</p>
        <img src="aranha.webp" alt="Aranha">
    </div>

</div>

</body>
</html>
